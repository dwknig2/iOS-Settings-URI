name: Interactive macOS (tmate)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-shell:
    name: Interactive macOS terminal
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Interactive SSH session
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
